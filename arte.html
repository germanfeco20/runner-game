<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Runner: prueba de arte</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0a0e27; overscroll-behavior: none; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: sans-serif;
    }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
    #panel {
      position: fixed; top: 8px; left: 8px; right: 8px; z-index: 1;
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    }
    #panel button {
      font: 600 14px sans-serif; color: #e8ecff; background: rgba(20, 24, 50, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 8px; padding: 8px 10px;
    }
    #panel button.on { background: #00a8b3; border-color: #00f0ff; color: #fff; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="panel">
    <button data-mode="day" class="on">Día</button>
    <button data-mode="night">Noche</button>
    <button id="jump">Saltar</button>
    <button id="crash">Chocar</button>
    <button id="hitbox">Zona de choque</button>
    <button id="slow">Lento</button>
  </div>
<script>
const LABEL = 'arte 1';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Mismas medidas y física que el juego (game.js), para que lo que se ve aquí sea lo que se verá allá.
const JUMP_HEIGHT = 2.2;
const RISE_TIME = 0.25;
const FALL_FACTOR = 1.8;
const GRAVITY_UP = (2 * JUMP_HEIGHT) / (RISE_TIME * RISE_TIME);
const GRAVITY_DOWN = GRAVITY_UP * FALL_FACTOR;
const JUMP_SPEED = (2 * JUMP_HEIGHT) / RISE_TIME;
const HITBOX_INSET = 0.15;
const SPEED = 8; // lados por segundo: velocidad inicial del juego

// Paleta (Dirección de arte en CLAUDE.md). #ff2e63 queda reservado para obstáculos: no se usa aquí.
const THEMES = {
  day: {
    bg: '#d8ad89', deck: '#5a6278', deckEdge: '#8a93aa', frame: '#3a4058', beam: '#2e3348',
    light: 'rgba(0, 240, 255, 0.35)', rim: 'rgba(0, 240, 255, 0.9)', rimOuter: '#1a1f33', glow: 0.35,
  },
  night: {
    bg: '#0a0e27', deck: '#1f2548', deckEdge: '#3a4476', frame: '#151a3d', beam: '#10142f',
    light: 'rgba(0, 240, 255, 1)', rim: 'rgba(0, 240, 255, 0.95)', rimOuter: null, glow: 0.9,
  },
};
// Androide: chaqueta y pantalón oscuros (humano), metal claro con luz cian (robot).
const BODY = {
  jacket: '#1d2233', jacketFar: '#141826', pants: '#262b3d', pantsFar: '#1a1e2c',
  skin: '#c89a7a', metal: '#aab4c8', metalFar: '#7c869c', metalDark: '#5b6478',
  joint: '#39414f', cyan: '#00f0ff', boot: '#0f1119',
};

let mode = 'day';
let showHitbox = false;
let slow = false;

let width = 0;
let height = 0;
let groundY = 0;
let size = 0;

const player = { y: 0, vy: 0 };
const fx = { squash: 0, shake: 0, sparks: [], crash: 0 };
let runPhase = 0;
let scroll = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  width = canvas.clientWidth;
  height = canvas.clientHeight;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  groundY = Math.round(height * 0.75);
  size = Math.round(Math.min(width, height * 0.6) * 0.1);
  glowSprite = null;
}

function jump() {
  if (player.y > 0 || fx.crash > 0) return;
  player.vy = JUMP_SPEED;
  player.y = 0.0001;
  fx.squash = -0.25;
}

function crash() {
  if (fx.crash > 0) return;
  fx.crash = 1;
  fx.shake = 0.25;
  const x = (width * 0.2) / size + 0.8;
  const y = player.y + 0.7;
  for (let i = 0; i < 22; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6;
    const v = 3 + Math.random() * 6;
    fx.sparks.push({ x, y, vx: Math.cos(a) * v - 1, vy: -Math.sin(a) * v, life: 1, c: ['#ffd600', '#ffffff', '#00f0ff'][i % 3] });
  }
}

function update(dt) {
  const k = slow ? 0.25 : 1;
  dt *= k;
  const running = fx.crash <= 0;
  if (running) {
    scroll += SPEED * dt;
    if (player.y === 0) runPhase += dt * SPEED * (Math.PI / 1.25); // una zancada cada 1,25 lados
  }
  if (player.y > 0) {
    player.vy -= (player.vy > 0 ? GRAVITY_UP : GRAVITY_DOWN) * dt;
    player.y += player.vy * dt;
    if (player.y <= 0) {
      player.y = 0;
      player.vy = 0;
      fx.squash = 0.3;
    }
  }
  fx.squash *= Math.exp(-12 * dt);
  fx.shake = Math.max(0, fx.shake - dt);
  fx.crash = Math.max(0, fx.crash - dt / 1.2);
  for (const s of fx.sparks) {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy -= 14 * dt;
    s.life -= dt / 0.6;
  }
  fx.sparks = fx.sparks.filter((s) => s.life > 0 && s.y > -0.2);
}

// ---------- Pasarela metálica ----------
function drawWalkway(t) {
  const deckH = size * 0.28;
  ctx.fillStyle = t.frame;
  ctx.fillRect(0, groundY, width, height - groundY);
  // Vigas en diagonal bajo la pasarela, se desplazan con el suelo.
  ctx.strokeStyle = t.beam;
  ctx.lineWidth = Math.max(2, size * 0.12);
  const span = size * 1.6;
  const off = -((scroll * size) % span);
  ctx.beginPath();
  for (let x = off - span; x < width + span; x += span) {
    ctx.moveTo(x, groundY + deckH);
    ctx.lineTo(x + span / 2, height);
    ctx.moveTo(x + span, groundY + deckH);
    ctx.lineTo(x + span / 2, height);
  }
  ctx.stroke();
  // Placa superior y borde.
  ctx.fillStyle = t.deck;
  ctx.fillRect(0, groundY, width, deckH);
  ctx.fillStyle = t.deckEdge;
  ctx.fillRect(0, groundY, width, Math.max(2, size * 0.05));
  // Líneas de luz que corren con el suelo.
  ctx.fillStyle = t.light;
  const dash = size * 0.9;
  const gap = size * 0.6;
  const period = dash + gap;
  const o2 = -((scroll * size) % period);
  const ly = groundY + deckH * 0.55;
  for (let x = o2; x < width; x += period) ctx.fillRect(x, ly, dash, Math.max(2, size * 0.06));
}

// ---------- Androide ----------
// Coordenadas en lados del personaje, origen en los pies, y hacia arriba negativo.
function limb(x0, y0, a1, l1, a2, l2) {
  // a1: ángulo del segmento superior desde la vertical hacia abajo (positivo = hacia adelante).
  const x1 = x0 + Math.sin(a1) * l1;
  const y1 = y0 + Math.cos(a1) * l1;
  const x2 = x1 + Math.sin(a2) * l2;
  const y2 = y1 + Math.cos(a2) * l2;
  return [x0, y0, x1, y1, x2, y2];
}

function pose() {
  const air = player.y > 0;
  const p = runPhase;
  const crashT = fx.crash;
  let legs, arms, lean, bob;
  if (crashT > 0) {
    legs = { near: [0.5, -0.1], far: [-0.2, -0.6] };
    arms = { near: [-2.2, -2.6], far: [-1.8, -2.2] };
    lean = -0.35 * Math.min(1, (1 - crashT) * 6);
    bob = 0;
  } else if (air) {
    const up = Math.max(0, Math.min(1, player.vy / JUMP_SPEED)); // 1 al despegar, 0 en la cima
    legs = { near: [1.1 - up * 0.3, -0.2], far: [-0.3, -1.2 + up * 0.4] };
    arms = { near: [-0.9 - up * 0.6, -0.4], far: [0.8, 1.6] };
    lean = 0.12;
    bob = 0;
  } else {
    const s = Math.sin(p);
    const kneeNear = 0.25 + 1.05 * Math.max(0, Math.cos(p));
    const kneeFar = 0.25 + 1.05 * Math.max(0, Math.cos(p + Math.PI));
    const thighNear = 0.65 * s;
    const thighFar = -0.65 * s;
    legs = { near: [thighNear, thighNear - kneeNear], far: [thighFar, thighFar - kneeFar] };
    arms = { near: [-0.7 * s, -0.7 * s + 1.4], far: [0.7 * s, 0.7 * s + 1.4] };
    lean = 0.14;
    bob = -0.05 * Math.abs(Math.cos(p));
  }
  return { legs, arms, lean, bob };
}

function drawAndroid(t) {
  const { legs, arms, lean, bob } = pose();
  const s = size;
  const baseX = Math.round(width * 0.2) + s / 2;
  const baseY = groundY - player.y * s;

  // Estirar y aplastar, anclado en los pies (igual que el juego).
  const airStretch = player.y > 0 ? -0.12 * Math.min(Math.abs(player.vy) / JUMP_SPEED, 1) : 0;
  const k = Math.min(Math.max(fx.squash + airStretch, -0.3), 0.35);

  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.scale(1 + k, 1 - k);
  ctx.scale(s, s);
  ctx.rotate(fx.crash > 0 ? lean : lean * 0.8);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Proporciones: 1,3 lados de alto (la zona de choque sigue siendo el cuadrado de 1 lado).
  const hipY = -0.6 + bob;
  const hip = [0, hipY];
  const shoulder = [0.06, -1.0 + bob];
  const legL = 0.32;
  const armL = 0.25;
  const L = {
    farLeg: limb(hip[0] - 0.02, hip[1], legs.far[0], legL, legs.far[1], legL),
    nearLeg: limb(hip[0] + 0.02, hip[1], legs.near[0], legL, legs.near[1], legL),
    farArm: limb(shoulder[0] - 0.03, shoulder[1], arms.far[0], armL, arms.far[1], armL),
    nearArm: limb(shoulder[0] + 0.03, shoulder[1], arms.near[0], armL, arms.near[1], armL),
  };

  const seg = (pts, w, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    ctx.lineTo(pts[2], pts[3]);
    ctx.lineTo(pts[4], pts[5]);
    ctx.stroke();
  };
  const torsoPath = () => {
    ctx.beginPath();
    ctx.moveTo(shoulder[0] - 0.19, shoulder[1] - 0.02);
    ctx.lineTo(shoulder[0] + 0.17, shoulder[1] - 0.04);
    ctx.lineTo(hip[0] + 0.15, hip[1] + 0.02);
    ctx.lineTo(hip[0] - 0.16, hip[1] + 0.04);
    ctx.closePath();
  };
  const headPath = () => {
    ctx.beginPath();
    ctx.ellipse(shoulder[0] + 0.06, shoulder[1] - 0.2, 0.15, 0.16, 0, 0, Math.PI * 2);
  };
  const neck = (w, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(shoulder[0] + 0.02, shoulder[1] + 0.02);
    ctx.lineTo(shoulder[0] + 0.05, shoulder[1] - 0.1);
    ctx.stroke();
  };
  const foot = (pts, color) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(pts[4] + 0.06, pts[5] - 0.02, 0.1, 0.05, 0, 0, Math.PI * 2);
    ctx.fill();
  };

  // 1) Contorno: todas las piezas un poco más gruesas; la pasada 2 tapa el interior.
  //    De noche, luz cian. De día, además, un anillo oscuro por fuera: el metal y el cian se
  //    confunden con el smog claro (contraste ~1,0 y ~1,5) y el anillo oscuro los separa del fondo.
  const outline = (o, color) => {
    seg(L.farLeg, 0.15 + o, color);
    seg(L.farArm, 0.11 + o, color);
    neck(0.09 + o, color);
    ctx.strokeStyle = color;
    ctx.lineWidth = o;
    torsoPath();
    ctx.stroke();
    headPath();
    ctx.stroke();
    seg(L.nearLeg, 0.16 + o, color);
    seg(L.nearArm, 0.12 + o, color);
  };
  if (t.rimOuter) outline(0.1, t.rimOuter);
  outline(0.055, t.rim);

  // 2) Cuerpo. Atrás: pierna izquierda (metal) y brazo izquierdo (chaqueta).
  seg(L.farLeg, 0.15, BODY.metalFar);
  foot(L.farLeg, BODY.metalDark);
  seg(L.farArm, 0.11, BODY.jacketFar);

  // Torso con chaqueta, cuello alto y cierre.
  ctx.fillStyle = BODY.jacket;
  torsoPath();
  ctx.fill();
  ctx.strokeStyle = '#2c3348';
  ctx.lineWidth = 0.025;
  ctx.beginPath();
  ctx.moveTo(shoulder[0] + 0.1, shoulder[1]);
  ctx.lineTo(hip[0] + 0.09, hip[1]);
  ctx.stroke();

  // Cabeza: cuello, cabello oscuro atrás, cara y visor.
  neck(0.09, BODY.skin);
  ctx.fillStyle = BODY.skin;
  headPath();
  ctx.fill();
  ctx.fillStyle = BODY.boot;
  ctx.beginPath();
  ctx.ellipse(shoulder[0] + 0.02, shoulder[1] - 0.25, 0.14, 0.11, -0.3, Math.PI * 0.9, Math.PI * 2.05);
  ctx.fill();

  // Adelante: pierna derecha (humana) y brazo derecho (metal).
  seg(L.nearLeg, 0.16, BODY.pants);
  foot(L.nearLeg, BODY.boot);

  // Articulaciones y línea de luz en la pierna metálica (se dibujan después para que se vean).
  const joints = (pts, r) => {
    ctx.fillStyle = BODY.joint;
    for (const i of [0, 2]) {
      ctx.beginPath();
      ctx.arc(pts[i], pts[i + 1], r, 0, Math.PI * 2);
      ctx.fill();
    }
  };
  const lightLine = (pts, alpha) => {
    ctx.globalAlpha = alpha;
    seg(pts, 0.03, BODY.cyan);
    ctx.globalAlpha = 1;
  };
  joints(L.farLeg, 0.05);
  lightLine(L.farLeg, 0.6 + 0.4 * t.glow);

  seg(L.nearArm, 0.12, BODY.metal);
  joints(L.nearArm, 0.045);
  lightLine(L.nearArm, 0.6 + 0.4 * t.glow);
  // Hombro metálico.
  ctx.fillStyle = BODY.metalDark;
  ctx.beginPath();
  ctx.arc(shoulder[0] + 0.03, shoulder[1] + 0.02, 0.07, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = BODY.cyan;
  ctx.beginPath();
  ctx.arc(shoulder[0] + 0.03, shoulder[1] + 0.02, 0.025, 0, Math.PI * 2);
  ctx.fill();

  // Visor que brilla (parpadea al chocar).
  const visorOn = fx.crash > 0 ? Math.random() > 0.4 : true;
  const vx = shoulder[0] + 0.11;
  const vy = shoulder[1] - 0.22;
  ctx.fillStyle = visorOn ? BODY.cyan : '#1b4a50';
  ctx.beginPath();
  ctx.moveTo(vx - 0.06, vy - 0.035);
  ctx.lineTo(vx + 0.11, vy - 0.02);
  ctx.lineTo(vx + 0.11, vy + 0.03);
  ctx.lineTo(vx - 0.06, vy + 0.035);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  if (visorOn) drawGlow(baseX + (vx + 0.03) * s * (1 + k), baseY + vy * s * (1 - k), s * 0.2, t.glow * 0.7);
}

// Brillo: degradado radial pintado una sola vez y reutilizado (evita desenfoque en tiempo real).
let glowSprite = null;
function drawGlow(x, y, r, strength) {
  if (!glowSprite) {
    glowSprite = document.createElement('canvas');
    glowSprite.width = glowSprite.height = 64;
    const g = glowSprite.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(0, 240, 255, 0.9)');
    grad.addColorStop(0.35, 'rgba(0, 240, 255, 0.35)');
    grad.addColorStop(1, 'rgba(0, 240, 255, 0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = strength;
  ctx.drawImage(glowSprite, x - r, y - r, r * 2, r * 2);
  ctx.restore();
}

function drawSparks() {
  ctx.lineCap = 'round';
  for (const p of fx.sparks) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.strokeStyle = p.c;
    ctx.lineWidth = Math.max(1.5, size * 0.05);
    const x = p.x * size;
    const y = groundY - p.y * size;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - p.vx * size * 0.03, y + p.vy * size * 0.03);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawHitbox() {
  const left = (Math.round(width * 0.2) / size + HITBOX_INSET) * size;
  const w = (1 - 2 * HITBOX_INSET) * size;
  const bottom = groundY - (player.y + HITBOX_INSET) * size;
  const top = groundY - (player.y + 1) * size;
  ctx.save();
  ctx.setLineDash([4, 3]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#ffffff';
  ctx.strokeRect(left, top, w, bottom - top);
  ctx.restore();
}

// ---------- Cuadro y medición ----------
const frameTimes = [];
function drawHud() {
  const fps = frameTimes.length > 1 ? Math.round((1000 * (frameTimes.length - 1)) / (frameTimes[frameTimes.length - 1] - frameTimes[0])) : 0;
  ctx.font = '600 13px sans-serif';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = mode === 'day' ? 'rgba(20, 24, 50, 0.8)' : 'rgba(255, 255, 255, 0.75)';
  ctx.textAlign = 'left';
  ctx.fillText(`${fps} fps`, 8, height - 8);
  ctx.textAlign = 'right';
  ctx.fillText(LABEL, width - 8, height - 8);
}

function draw() {
  const t = THEMES[mode];
  ctx.save();
  if (fx.shake > 0) {
    const m = (fx.shake / 0.25) * size * 0.2;
    ctx.translate((Math.random() - 0.5) * 2 * m, (Math.random() - 0.5) * 2 * m);
  }
  ctx.fillStyle = t.bg;
  ctx.fillRect(-size, -size, width + 2 * size, height + 2 * size);
  drawWalkway(t);
  drawAndroid(t);
  drawSparks();
  if (showHitbox) drawHitbox();
  ctx.restore();
  drawHud();
}

let last = 0;
function loop(time) {
  const dt = last ? Math.min((time - last) / 1000, 1 / 30) : 0;
  last = time;
  frameTimes.push(time);
  while (frameTimes.length > 60) frameTimes.shift();
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- Controles ----------
const buttons = document.querySelectorAll('#panel button');
for (const b of buttons) b.addEventListener('pointerdown', (e) => e.stopPropagation());
document.querySelectorAll('[data-mode]').forEach((b) =>
  b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach((x) => x.classList.toggle('on', x === b));
  }));
document.getElementById('jump').addEventListener('click', jump);
document.getElementById('crash').addEventListener('click', crash);
document.getElementById('hitbox').addEventListener('click', (e) => {
  showHitbox = !showHitbox;
  e.currentTarget.classList.toggle('on', showHitbox);
});
document.getElementById('slow').addEventListener('click', (e) => {
  slow = !slow;
  e.currentTarget.classList.toggle('on', slow);
});
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  jump();
});
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) jump();
  }
});
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
